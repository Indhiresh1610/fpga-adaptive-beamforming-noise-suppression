# Vitis HLS (unified flow) config -- Real Digital Boolean Board (XC7S50-1CSGA324)
part=xc7s50csga324-1

[hls]
flow_target=vivado
# Deliberately slow: 40 ns = 25 MHz. Raise to 100ns for 10 MHz if you like; the block
# deadline is 128 ms, the design needs well under 1 ms.
clock=40ns
clock_uncertainty=12%

syn.file=mvdr_block.cpp
syn.file_cflags=-I.
# Use mvdr_block_top for the plain engine, or mvdr_store_top to keep the signal in BRAM.
syn.top=mvdr_block_top

# C-simulation: solver unit test.  Replace/add your own Python-signal testbench file.
tb.file=tb_rdr_solver.cpp
tb.file_cflags=-I.
